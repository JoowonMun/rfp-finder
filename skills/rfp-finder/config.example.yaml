# rfp-finder 설정 예시
# 이 파일을 %USERPROFILE%\.rfp-finder\config.yaml 로 복사해 팀에 맞게 고치세요.
# (첫 실행 시 스킬이 질문을 통해 자동으로 만들어 주기도 합니다.)

team:
  name: 우리팀
  capabilities: |
    팀이 하는 일을 우선순위 단계별로 적으세요. Claude가 적합도 점수를 매기는 기준이 됩니다.
    최우선 주력: (예) 생성형 AI 구축 — LLM 서비스, RAG, AI Agent, AI 챗봇
    그다음: (예) 그 외 AI 모델 개발, AI 개발 사업의 개발 컨설팅(구축 설계, 개발 PMO)
    우선순위 낮음: (예) AI 도입 ISP/ISMP, AI 전환 전략·비전 수립
    보유 자격: (예) 소프트웨어사업자, 중소기업 확인서, 직접생산확인증명서
    주력 아님: (예) 데이터 플랫폼 구축, 인프라·장비, 교육 운영, 유지보수
  past_projects: |
    (선택) 대표 수행 실적. 참가 자격(실적 요건) 판단에 도움이 됩니다.

filters:
  include_keywords: [AI, 인공지능, 생성형, LLM, RAG, 챗봇, 에이전트, 머신러닝, 딥러닝, AX]   # "데이터", "ISP"처럼 넓은 말은 일반 정보화까지 끌어옴
  exclude_keywords: [유지보수, 유지관리, 구매, 임차, 물품, 공사]
  # 제목에 많이 걸릴수록 먼저 분석 (팀이 특히 원하는 사업 유형)
  priority_keywords: [구축, 개발, 생성형, LLM, RAG, 챗봇, 에이전트, 모델]
  budget_min_krw: 50000000       # 비워두면 하한 없음
  budget_max_krw: 3000000000     # 비워두면 상한 없음
  min_days_to_deadline: 5        # 본공고에만 적용
  include_pre_spec: true         # 사전규격 포함 여부

collect:
  lookback_days: 30              # 최근 N일 등록 공고 중 마감 안 지난 것을 봄 (용역은 대부분 30일 안에 마감)
  max_per_run: 15                # 한 번에 분석할 공고 수 상한 (첫 실행은 밀린 공고가 많으니 30 정도로)

notion:
  database_id: ""                # scout.py setup-notion 이 채워 줍니다
  max_upload_mb: 5               # 노션 무료 요금제 파일당 한도
